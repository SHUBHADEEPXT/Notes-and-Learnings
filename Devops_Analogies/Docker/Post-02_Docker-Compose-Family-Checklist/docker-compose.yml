version: '3'
services:
  frontend:
    image: react-app
    depends_on:
      - backend
    ports:
      - "3000:3000"

  backend:
    image: node-api
    depends_on:
      - database
    ports:
      - "5000:5000"

  database:
    image: postgres
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
